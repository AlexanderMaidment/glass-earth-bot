name: Test Bot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Post the forecasts to the bot testing area on Metaculus (not scored). Leave unticked for a dry run that posts nothing."
        type: boolean
        default: false

# Glass Earth: one group for every workflow that can spend on models, so runs
# never overlap and each one sees the spending of the runs before it (the
# daily cap in spend.py reads forecasts/spend.jsonl). A run queued behind
# another waits; GitHub cancels an older waiting run when a newer one queues.
concurrency:
  group: glass-earth-model-spend
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    permissions:
      contents: write # lets the last step commit forecasts/ledger.jsonl
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run the offline tests
        # No network, no keys, no cost. A failing test stops the run before
        # any model is called.
        run: uv run --locked python -m unittest discover -s tests
      - name: Run bot
        run: |
          if [ "$PUBLISH" = "true" ]; then
            uv run python main.py --mode test_questions
          else
            uv run python main.py --mode test_questions --dry-run
          fi
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          PUBLISH: ${{ inputs.publish }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Glass Earth spending: the daily cap in US dollars (default 2.00) and
          # the part of it kept for high-value questions (default 40% of the
          # cap, at most 2.00: 0.80 at the default cap).
          GLASS_EARTH_DAILY_CAP_USD: ${{ vars.GLASS_EARTH_DAILY_CAP_USD }}
          GLASS_EARTH_HIGH_VALUE_RESERVE_USD: ${{ vars.GLASS_EARTH_HIGH_VALUE_RESERVE_USD }}
          # Glass Earth forecasters: forecasts per question (1 to 5, default 1)
          # and whether high-value questions go to Fable (true or false,
          # default false). A value the bot cannot use stops the run.
          GLASS_EARTH_ENSEMBLE_SIZE: ${{ vars.GLASS_EARTH_ENSEMBLE_SIZE }}
          GLASS_EARTH_HIGH_VALUE_MODEL: ${{ vars.GLASS_EARTH_HIGH_VALUE_MODEL }}
      - name: Commit the forecast ledger and spend record
        # Only a run with "publish" ticked submits forecasts. Every run, a dry
        # run too, records what it spent on models in forecasts/spend.jsonl.
        if: always()
        run: |
          bash scripts/commit_and_push.sh "Ledger: test-area run ${{ github.run_id }}" forecasts/ledger.jsonl forecasts/spend.jsonl
