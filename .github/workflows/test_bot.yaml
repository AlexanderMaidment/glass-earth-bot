name: Test Bot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Post the forecasts to the bot testing area on Metaculus (not scored). Leave unticked for a dry run that posts nothing."
        type: boolean
        default: false

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    permissions:
      contents: write # lets the last step commit forecasts/ledger.jsonl
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          if [ "$PUBLISH" = "true" ]; then
            uv run python main.py --mode test_questions
          else
            uv run python main.py --mode test_questions --dry-run
          fi
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          PUBLISH: ${{ inputs.publish }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Commit the forecast ledger
        # Only a run with "publish" ticked submits anything. A dry run writes
        # nothing here, so this step then finds nothing to commit.
        if: always()
        run: |
          bash scripts/commit_and_push.sh "Ledger: test-area forecasts submitted in run ${{ github.run_id }}" forecasts/ledger.jsonl
